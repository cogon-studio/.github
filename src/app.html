<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script data-initial-load>
			(() => {
				const root = document.documentElement;
				const modeKey = 'mode-watcher-mode';
				const splashKey = 'cogon-splash-complete';
				const minimumMs = 1400;
				const maximumMs = 8000;
				const fadeMs = 260;
				let storedMode = 'system';

				try {
					const candidate = localStorage.getItem(modeKey);
					if (candidate === 'light' || candidate === 'dark' || candidate === 'system') {
						storedMode = candidate;
					}
				} catch {}

				const isDark =
					storedMode === 'dark' ||
					(storedMode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				root.classList.toggle('dark', isDark);
				root.style.colorScheme = isDark ? 'dark' : 'light';

				try {
					localStorage.setItem(modeKey, storedMode);
				} catch {}

				let shouldShowSplash = true;
				try {
					shouldShowSplash = sessionStorage.getItem(splashKey) !== 'true';
				} catch {}

				root.dataset.splash = shouldShowSplash ? 'active' : 'done';

				const syncAccessibility = () => {
					const active = root.dataset.splash === 'active' || root.dataset.splash === 'releasing';
					const shell = document.getElementById('app-shell');
					const splash = document.getElementById('initial-splash');
					if (shell) {
						shell.inert = active;
						if (active) shell.setAttribute('aria-hidden', 'true');
						else shell.removeAttribute('aria-hidden');
					}
					if (splash) splash.setAttribute('aria-hidden', active ? 'false' : 'true');
				};

				window.__cogonSyncSplash = syncAccessibility;

				if (!shouldShowSplash) {
					window.__cogonReleaseSplash = () => {};
					return;
				}

				const startedAt = performance.now();
				let releaseTimer;
				let finished = false;

				const finish = (forced = false) => {
					if (finished) return;
					finished = true;
					if (releaseTimer) clearTimeout(releaseTimer);
					try {
						sessionStorage.setItem(splashKey, 'true');
					} catch {}

					const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
					if (forced || reduceMotion) {
						root.dataset.splash = 'done';
						syncAccessibility();
						return;
					}

					root.dataset.splash = 'releasing';
					syncAccessibility();
					setTimeout(() => {
						root.dataset.splash = 'done';
						syncAccessibility();
					}, fadeMs);
				};

				window.__cogonReleaseSplash = () => {
					const remaining = minimumMs - (performance.now() - startedAt);
					if (remaining > 0) releaseTimer = setTimeout(() => finish(), remaining);
					else finish();
				};

				setTimeout(() => finish(true), maximumMs);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
		THESIS: Load-bearing engineering infrastructure. Forest ink, lime action, heavy type.
		STRUCTURE: Wise Platform section order — hero type, video, proof, two tracks, product tabs, delivery, partnering, standards, close.
		STORY: A founder sees a desk that holds, then emails a real next step.
		-->
		<div id="app-shell" style="display: contents" inert aria-hidden="true">%sveltekit.body%</div>
		<div id="initial-splash" role="status" aria-live="polite" aria-label="Loading cogon.studio">
			<div class="splash-logo" aria-hidden="true">
				<svg viewBox="0 0 256 256" width="112" height="112">
					<g class="splash-logo__fills">
						<path class="splash-logo__blade blade-gold-left" d="M99 225C73 207 49 179 48 142C47 111 62 80 76 73C83 69 89 72 88 79C68 117 65 175 99 225Z" />
						<path class="splash-logo__blade blade-forest" d="M99 225C82 180 83 129 102 89C125 42 175 7 204 7C214 7 218 12 212 20C171 51 129 105 99 225Z" />
						<path class="splash-logo__blade blade-sprout" d="M102 225C112 174 128 126 155 101C173 84 198 74 213 75C222 76 225 82 218 89C170 118 133 163 102 225Z" />
						<path class="splash-logo__blade blade-gold-right" d="M105 225C135 184 167 157 218 143C227 140 234 143 233 150C231 158 191 167 155 190C134 202 118 214 105 225Z" />
					</g>
					<g class="splash-logo__outlines">
						<path pathLength="1" d="M99 225C73 207 49 179 48 142C47 111 62 80 76 73C83 69 89 72 88 79C68 117 65 175 99 225Z" />
						<path pathLength="1" d="M99 225C82 180 83 129 102 89C125 42 175 7 204 7C214 7 218 12 212 20C171 51 129 105 99 225Z" />
						<path pathLength="1" d="M102 225C112 174 128 126 155 101C173 84 198 74 213 75C222 76 225 82 218 89C170 118 133 163 102 225Z" />
						<path pathLength="1" d="M105 225C135 184 167 157 218 143C227 140 234 143 233 150C231 158 191 167 155 190C134 202 118 214 105 225Z" />
					</g>
				</svg>
			</div>
			<p>cogon.studio</p>
		</div>
		<script>
			window.__cogonSyncSplash?.();
		</script>
	</body>
</html>
